# OKH-Manifest – Open Know-How Standard, Version 2.4
# Spezifikation: https://github.com/iop-alliance/OpenKnowHow
# Schema:        https://w3id.org/oseg/schema/okh.schema.json
#
# Dieses Manifest beschreibt das Produkt als Open-Source-Hardware-Werk.
# Verkaufsdaten (Preise, Lieferbedingungen, Bestände) gehören NICHT hier rein
# - sie werden separat im Shop-Backend (Medusa) verwaltet.
#
# Pflichtfelder: okhv, name, repo, license, licensor, function
#
# ----------------------------------------------------------------------------
# WICHTIG zur TOML-Reihenfolge:
# Alle Top-Level-Felder (skalare Werte und einfache Arrays) MÜSSEN vor dem
# ersten Section-Header ([...] oder [[...]]) stehen.
# ----------------------------------------------------------------------------

# ============================================================================
# TOP-LEVEL-FELDER
# ============================================================================

"$schema" = "https://w3id.org/oseg/schema/okh.schema.json"

okhv = "2.4"

# --- Identität ---
name = "FIXME Produktname"
repo = "https://github.com/heimeliq/FIXME-<series>-<type>"

# --- Lizenz ---
license = "CERN-OHL-S-2.0"
licensor = "FIXME Vorname Nachname (FIXME-nickname) <FIXME@heimeliq.de>"

# --- Beschreibung ---
function = """
FIXME: Was tut dieses Produkt? Wofür ist es gemacht?
Wer profitiert davon, welches Problem löst es?
Mehrere Sätze sind erlaubt und erwünscht – dieses Feld wird in OSH-Suchen
als Hauptbeschreibung verwendet.
"""

# --- Dokumentations-Sprache(n) ---
documentation-language = "de"

# --- Reifegrad der Dokumentation ---
documentation-readiness-level = "ODRL-2"

# --- Technologie-spezifische Dokumentationskriterien ---
tsdc = ["MEC", "ASM"]

# --- Masse des Produkts (in Gramm) ---
mass = 0     # FIXME

# --- Pfade zu Dokumentations-Dateien ---
manufacturing-instructions = "docs/de/build-guide.md"
bom = "docs/de/bom.md"
readme = "README.md"

# --- Quell- und Exportdateien des ganzen Produkts ---
# Die Variante V001 verlinkt die Baugruppen und ist das dokumentierte Produkt
# (heimeliq.toml -> [variants], Referenz-Option). Ihre Datei und ihre Exporte
# stehen hier, die Dateien der Baugruppen je Bauteil unter [[part]].
# V002 und höher gehören nicht in dieses Manifest.
source = "cad/source/V001-FIXME-slug-FIXME-kurzname.FCStd"
export = ["cad/exports/V001-FIXME-slug-FIXME-kurzname.step", "cad/exports/V001-FIXME-slug-FIXME-kurzname.stl"]

# ============================================================================
# SECTIONS
# ============================================================================

# --- Äußere Abmessungen des Produkts (in mm) ---
# Beschreibt ausschließlich die Referenzvariante (heimeliq.toml -> [variants]
# -> reference). OKH kennt keine Sortimente; der Standard wird dafür bewusst
# nicht gedehnt. Weitere Größen stehen nur in heimeliq.toml unter [variants]
# und werden später als Release-Artefakt ausgerechnet.
[outer-dimensions]
width = 0    # FIXME
depth = 0    # FIXME
height = 0   # FIXME

# --- Organisation ---
[[organization]]
name = "heimeliq"
url = "https://heimeliq.de"

# --- Hauptbilder (für Außenwirkung) ---
[[image]]
location = "media/hero.jpg"
slots = ["photo-thing-main", "model-main"]
tags = ["photo"]
depicts = "FIXME: kurze Beschreibung des Hauptbildes"

# ============================================================================
# EIGENE BAUTEILE (open-source, in OKH-`part`-Array)
# ============================================================================
# Jedes Bauteil bekommt eine Produkt-lokale, voll-qualifizierte ID:
#   A001.S001, A001.S002, ...  (Bauteile der ersten Baugruppe)
#   A002.S001, A002.S002, ...  (Bauteile einer Sub-Baugruppe)
#
# `source` zeigt auf die FreeCAD-Datei der zugehörigen Baugruppe,
# in der das Bauteil definiert ist, `export` auf deren Exporte — beide heißen
# A00n-<slug>-<kurzname>, mit dem Kurznamen aus heimeliq.toml [[assemblies]].
#
# Externe Drittteile (Schrauben, Beschläge) stehen NICHT hier, sondern in
# heimeliq.toml unter [[external_parts]].
#
# `outer-dimensions` je Bauteil bezieht sich – wie die Produkt-Außenmaße oben –
# ausschließlich auf die Referenzvariante.
#
# Ein Bauteil ist eine ART mit Stückzahl, keine Reihe gleichartiger Einträge.
# Fünf Innenböden sind EIN [[part]] mit `quantity = 5`, nicht fünf Einträge –
# sonst wächst die Liste mit der Bestückung und dieselbe ID bedeutet in zwei
# Varianten nicht mehr dasselbe. `quantity` weglassen heißt 1.
# Bauteile, die sich unterscheiden, bleiben getrennt: Seitenwand links und
# rechts sind zwei Arten, auch wenn sie sich spiegeln.

[[part]]
name = "FIXME Bauteilname (z. B. Korpus-Seitenwand links)"
source = "cad/source/A001-FIXME-slug-FIXME-kurzname.FCStd"
export = ["cad/exports/A001-FIXME-slug-FIXME-kurzname.step", "cad/exports/A001-FIXME-slug-FIXME-kurzname.stl"]
mass = 0
quantity = 1
heimeliq-part-id = "A001.S001"
heimeliq-assembly = "A001"
tsdc = ["MEC"]
outer-dimensions = { width = 0, depth = 0, height = 0 }

# Beispiel für ein Bauteil in einer Sub-Baugruppe (z. B. Schublade).
# Bei Bedarf entfernen.
[[part]]
name = "FIXME Bauteilname in Sub-Baugruppe (z. B. Schubladen-Boden)"
source = "cad/source/A002-FIXME-slug-FIXME-kurzname.FCStd"
export = ["cad/exports/A002-FIXME-slug-FIXME-kurzname.step", "cad/exports/A002-FIXME-slug-FIXME-kurzname.stl"]
mass = 0
heimeliq-part-id = "A002.S001"
heimeliq-assembly = "A002"
tsdc = ["MEC"]
outer-dimensions = { width = 0, depth = 0, height = 0 }
